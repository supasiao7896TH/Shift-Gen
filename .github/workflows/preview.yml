name: Preview

# ทุก PR ได้ URL ชั่วคราวที่เปิดบนมือถือได้ ก่อนของจริงจะขึ้น production
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # ไม่เขียว = ไม่มี preview · preview ไม่ใช่ทางลัดข้าม gate
      - run: npm run check
      - run: npm run build

      - uses: cloudflare/wrangler-action@v4
        id: upload
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: versions upload

      - uses: actions/github-script@v7
        with:
          script: |
            const out = `${{ steps.upload.outputs.command-output }}`;
            const url = (out.match(/https:\/\/[a-z0-9-]+\.[a-z0-9-]+\.workers\.dev/i) || [])[0];
            const body = url
              ? `เปิดบนมือถือแล้วลองจริงได้เลยค่ะ → ${url}\n\n(เวอร์ชันนี้ยังไม่ขึ้น production จนกว่าจะ merge)`
              : "อัปโหลด preview แล้ว แต่ดึง URL จาก output ไม่ได้ — ดูที่ log ของ step 'versions upload'";
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
